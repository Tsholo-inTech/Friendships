<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        
        {% block title %}
            Django Interface
        {% endblock %}    

    </title>

    <style>
        table {
            border-collapse: collapse;
            background: white;
            color: black;
        }
         
        th,
        td {
            font-weight: medium;
        }

        .calendar-container {
            max-width: 800px;
            margin: 40px auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
    </style>
</head>
<link rel = "stylesheet" href = "{% static 'css/style.css' %}">

<body>
    <div class="calendar-container">
        <section class="calender">
            
            <h2 align="center" style="background: red;">
                📆Events & Reminders📆
            </h2>
            <h2 align="center" style="color: orange;">
                April, 2025
            </h2>

            <table bgcolor="lightgrey" align="center" cellspacing="21" cellpadding="21">
                <caption align="top">
                </caption>

                <thead>
                    <tr>
                        
                        <th style="color: white; background: red;">
                            Sun</th>
                        <th style="color: white; background: red;">
                            Mon</th>
                        <th style="color: white; background: red;">
                            Tue</th>
                        <th style="color: white; background: red;">
                            Wed</th>
                        <th style="color: white; background: red;">
                            Thu</th>
                        <th style="color: white; background: red;">
                            Fri</th>
                        <th style="color: white; background: red;">
                            Sat</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td></td>
                        <td></td>
                        <td>1</td>
                        <td>2</td>
                        <td>3</td>
                        <td>4</td>
                        <td>5</td>
                    </tr>
                    <tr></tr>
                    <tr>
                        <td>6</td>
                        <td>7</td>
                        <td>8</td>
                        <td>9</td>
                        <td>10</td>
                        <td>11</td>
                        <td>12</td>
                    </tr>
                    <tr>
                        <td>13</td>
                        <td>14</td>
                        <td>15</td>
                        <td>16</td>
                        <td>17</td>
                        <td>18</td>
                        <td>19</td>
                    </tr>
                    <tr>
                        <td>20</td>
                        <td>21</td>
                        <td>22</td>
                        <td>23</td>
                        <td>24</td>
                        <td>25</td>
                        <td>26</td>
                    </tr>
                    <tr>
                        <td>27</td>
                        <td>28</td>
                        <td>29</td>
                        <td>30</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    
                </tbody>
            </table>
        </section>
    </div>

    <h1 class="gradient">THE END</h1>

</body>
</html>
